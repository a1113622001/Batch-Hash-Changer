name: Build and Release C Native Executable

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build C Binary
        shell: cmd
        run: |
          call build.bat

      - name: Run Automated Test Suite
        shell: cmd
        run: |
          bin\test_suite.exe

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatchHashChanger-Release
          path: |
            bin/BatchHashChanger.exe
            bin/批量文件哈希值修改工具.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/BatchHashChanger.exe
            bin/批量文件哈希值修改工具.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
